<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>My To Do List</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>
    <div class="todo-container">
        <h2>My To Do List</h2>
        <ul class="todo-list">
            <li><input type="checkbox"> <span>Hit the gym</span> <span class="red-cross">&#10006;</span></li>
            <li class="completed"><input type="checkbox" checked> <span>Pay bills</span> <span class="red-cross">&#10006;</span></li>
            <li><input type="checkbox"> <span>Meet John</span> <span class="red-cross">&#10006;</span></li>
            <li><input type="checkbox"> <span>Buy eggs</span> <span class="red-cross">&#10006;</span></li>
            <li class="completed"><input type="checkbox" checked> <span>Read a book</span> <span class="red-cross">&#10006;</span></li>
            <li><input type="checkbox"> <span>Organize office</span> <span class="red-cross">&#10006;</span></li>
            <li><input type="checkbox"> <span>Eat dinner</span> <span class="red-cross">&#10006;</span></li>
            <li><input type="checkbox"> <span>Buy apples</span> <span class="red-cross">&#10006;</span></li>
            <li><input type="checkbox"> <span>Meet George</span> <span class="red-cross">&#10006;</span></li>
            <li><input type="checkbox"> <span>Feed the cat</span> <span class="red-cross">&#10006;</span></li>
            <li class="completed"><input type="checkbox" checked> <span>Write a letter</span> <span class="red-cross">&#10006;</span></li>
            <li><input type="checkbox"> <span>Run 1 km</span> <span class="red-cross">&#10006;</span></li>
        </ul>
    </div>
</body>
</html>
